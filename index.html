<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Nav - Flexbox Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        a {
            text-decoration: none;
        }

        nav {
            width: 100%;
            min-height: 64px;
            background: #001635;
            padding: 0 24px;
            display: flex;
            justify-content: space-between; 
            align-items: center; 
        }
        
        .logo {
            color: #D2DAE7;
            font-size: 20px;
            font-weight: 700;
        }

        ul {
            list-style: none;
            display: flex; 
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        li > a {
            color: #D2DAE7;
            font-size: 15px;
            transition: color 0.3s;
        }

        li > a:hover {
            color: #ffffff;
        }

        @media (max-width: 1024px) {
            nav {
                flex-direction: column;
                align-items: flex-start; 
                padding: 24px;
                gap: 24px;
            }
            ul {
                flex-direction: column;
                width: 100%;
                gap: 12px;
            }

            ul > li {
                width: 100%;
            }

        }

        @media (max-width: 768px) {
            nav {
                flex-direction: row;
                min-height: 32px;
                padding: 0 12px;
                align-items: center;
            }
            .logo {
                font-size: 12px;
            }
            ul{
                flex-direction: row;
                align-items: center;
                gap: 16px;
                width: auto;
            }
            li > a {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <span class="logo">
                THEMES
            </span>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Orders</a></li>
                <li><a href="">Products</a></li>
                <li><a href="">Customer</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
