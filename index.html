<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Nav - Flexbox Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        a {
            text-decoration: none;
        }

        nav {
            width: 100%;
            min-height: 64px;
            background: #001635;
            padding: 0 24px;
            display: flex;
            justify-content: space-between; 
            align-items: center; 
        }
        
        .logo {
            color: #D2DAE7;
            font-size: 20px;
            font-weight: 700;
        }

        ul {
            list-style: none;
            display: flex; 
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        li > a {
            color: #D2DAE7;
            font-size: 15px;
            transition: color 0.3s;
        }

        li > a:hover {
            color: #ffffff;
        }

        .container-section{
            width: 100%;
            background: linear-gradient(to right, #4F39F6 50%, #8200DB 50%);
            min-height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container-section > .text{
            width: 50%;
            padding-left: 50px;
            color: white;
        }
        .container-section > .image{
            width: 50%;
            opacity: 30%;
        }
        .image > img{
             width: 100%;   
        }


        @media (max-width: 1024px) {
            nav {
                flex-direction: column;
                align-items: flex-start; 
                padding: 24px;
                gap: 24px;
            }
            ul {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: row;
                min-height: 32px;
                padding: 0 12px;
                align-items: center;
            }
            .logo {
                font-size: 12px;
            }
            ul{
                flex-direction: row;
                align-items: center;
                gap: 16px;
            }
            li > a {
                font-size: 9px;
            }
            
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <span class="logo">
                THEMES
            </span>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Orders</a></li>
                <li><a href="">Products</a></li>
                <li><a href="">Customer</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="container-section">
            <div class="text">
                <h2>Lorem Ipsum</h2>
                Lorem, ipsum dolor sit amet consectetur adipisicing elit. 
            </div>
            <div class="image">
                <img src="/landing-section.png" alt="">
            </div>
        </section>
    </main>
</body>
</html>
